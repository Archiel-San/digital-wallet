spring.application.name=user-service

# Server
server.port=8081

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=postgres
spring.datasource.password=0000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security - OAuth2 Resource Server JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/Digital-Wallet

kc.server-url=${KC_SERVER_URL:http://localhost:8080}
kc.realm=${KC_REALM:Digital-Wallet}
kc.client-id=${KC_CLIENT_ID:wallet-mobile-app}
kc.client-secret=${KC_CLIENT_SECRET:digital-wallet-demo-secret}

# Kafka Broker Address
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Topic Name (custom property)
kafka.topic.name=user-creation-topic

# Eureka
eureka.instance.prefer-ip-address=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
